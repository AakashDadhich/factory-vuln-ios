name: FactoryVulnIOS
options:
  bundleIdPrefix: dev.aakashdadhich.factory
  deploymentTarget:
    iOS: "17.0"
packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation
    exactVersion: 0.9.16
targets:
  FactoryVulnIOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
    dependencies:
      - package: ZIPFoundation
        product: ZIPFoundation
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: FactoryVulnIOS
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.aakashdadhich.factory.FactoryVulnIOS
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_ENTITLEMENTS: Config/App.entitlements
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
schemes:
  FactoryVulnIOS:
    build:
      targets:
        FactoryVulnIOS: all
