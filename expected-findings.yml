- id: ats
  stage: apple-checks
  rule_id: ^ats-allows-arbitrary-loads$
  min_severity: high
- id: privacy-manifest
  stage: apple-checks
  rule_id: ^privacy-manifest-missing$
  min_severity: high
- id: get-task-allow
  stage: apple-checks
  rule_id: ^get-task-allow-release$
  min_severity: high
- id: keychain-always
  stage: [apple-checks, sast-semgrep]
  rule_id: keychain-accessible-always
  min_severity: high
  path: ^Sources/Session\.swift$
- id: userdefaults-token
  stage: sast-semgrep
  rule_id: userdefaults-sensitive-value
  min_severity: high
  path: ^Sources/Session\.swift$
- id: md5
  stage: sast-semgrep
  cwe: CWE-328
  min_severity: medium
  path: ^Sources/Credentials\.swift$
- id: vulnerable-package
  stage: deps-sbom
  rule_id: ^CVE-2023-39138$
  min_severity: high
  path: ^Package\.resolved$
- id: mobsf-ats
  stage: mobsf
  rule_id: mobsf
  min_severity: info
  optional: true
